name: Deploy paper website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate website
        run: |
          test -f site/index.html
          test -f site/.nojekyll

      # Publish the static tree directly. This avoids the Pages REST API,
      # which requires repository-admin access to initialize a disabled site.
      - name: Publish gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publish_dir="${RUNNER_TEMP}/fusereg-pages"
          mkdir -p "${publish_dir}"
          cp -a "${GITHUB_WORKSPACE}/site/." "${publish_dir}/"

          cd "${publish_dir}"
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Deploy ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
